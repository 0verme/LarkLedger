services:
  app:
    image: ghcr.io/0verme/larkledger:${LARK_LEDGER_IMAGE_TAG:-latest}
    env_file: ${LARK_LEDGER_ENV_FILE:-.env}
    ports:
      - "8000:8000"
    restart: unless-stopped
    # P42: same graceful-stop budget as the source compose so in-flight leases
    # are finished or left for reclaim before the container is killed.
    stop_grace_period: 60s
