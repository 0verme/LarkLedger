services:
  app:
    environment:
      LARK_LEDGER_DATABASE_URL: postgresql+asyncpg://lark_ledger:dev-only-password@db:5432/lark_ledger
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lark_ledger
      POSTGRES_USER: lark_ledger
      POSTGRES_PASSWORD: dev-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lark_ledger -d lark_ledger"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${LARK_LEDGER_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - lark_ledger_dev_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  lark_ledger_dev_pgdata:
