services:
  app:
    build: .
    env_file: ${LARK_LEDGER_ENV_FILE:-.env}
    ports:
      - "8000:8000"
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn lark_ledger.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    # P42 production hygiene: liveness via the container healthcheck (process
    # alive), and a graceful-stop budget that lets in-flight events / leases be
    # finished or left for reclaim before SIGKILL.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 60s
