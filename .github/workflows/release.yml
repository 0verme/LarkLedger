name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  # Minimum required:
  #   contents  -> create GitHub Release (gh release create)
  #   packages  -> push image to GHCR
  # No actions/issues/pull-requests/id-token write access is granted.
  contents: write
  packages: write

concurrency:
  # Serialize re-runs for the same tag; never cancel an in-flight image publish.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag / version / notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so the annotated tag object is present locally.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Annotated tag guard
        run: bash scripts/release/verify-annotated-tag.sh "$GITHUB_REF_NAME"
      - name: Tag ↔ version consistency guard
        run: python scripts/release/verify-version.py "$GITHUB_REF_NAME"
      - name: CHANGELOG / release notes guard
        run: python scripts/release/extract-release-notes.py "$GITHUB_REF_NAME" --check-only

  image:
    name: Build and push GHCR image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/0verme/larkledger
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Resolve build identity
        id: identity
        # P42 build identity: bake version / commit / build time into the image
        # so the running instance can answer "which build am I?".
        # - version is the bare semver (strip the v prefix from the tag)
        # - github.event.head_commit is null on tag pushes, so derive the build
        #   timestamp here instead of reading it from the event payload
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            LARK_LEDGER_VERSION=${{ steps.identity.outputs.version }}
            LARK_LEDGER_GIT_SHA=${{ github.sha }}
            LARK_LEDGER_BUILD_TIME=${{ steps.identity.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create / verify GitHub Release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate release notes
        run: |
          python scripts/release/extract-release-notes.py "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/release-notes.md" \
            --title-output "$RUNNER_TEMP/release-title.txt"
      - name: Create or verify GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          TITLE_FILE: ${{ runner.temp }}/release-title.txt
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          TITLE="$(cat "$TITLE_FILE")"
          if gh release view "$TAG" --json tagName,draft,isPrerelease >/dev/null 2>&1; then
            echo "Release '${TAG}' already exists; verifying it is a formal release"
            VIEWED_TAG="$(gh release view "$TAG" --json tagName --jq '.tagName')"
            if [ "$VIEWED_TAG" != "$TAG" ]; then
              echo "::error::existing release tag_name mismatch (viewed '${VIEWED_TAG}')" >&2
              exit 1
            fi
            DRAFT="$(gh release view "$TAG" --json draft --jq '.draft')"
            PRE="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')"
            if [ "$DRAFT" = "true" ] || [ "$PRE" = "true" ]; then
              echo "::error::existing release '${TAG}' is draft=${DRAFT} prerelease=${PRE}; refusing to auto-modify a non-formal release" >&2
              exit 1
            fi
            echo "status=verified-existing" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
            echo "status=created" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release summary
        if: always() && steps.release.conclusion != 'skipped'
        env:
          RELEASE_STATUS: ${{ steps.release.outputs.status }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Release summary

          | Item | Value |
          | --- | --- |
          | Tag | \`${TAG}\` |
          | Version | \`${VERSION}\` |
          | GHCR image | \`ghcr.io/0verme/larkledger:${VERSION}\` |
          | GitHub Release | [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}) |
          | Status | ${RELEASE_STATUS:-unknown} |
          EOF
