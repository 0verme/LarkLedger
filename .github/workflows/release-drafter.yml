name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  # Serialize updates so concurrent merges cannot race on the same next draft.
  group: release-drafter-main
  cancel-in-progress: false

jobs:
  update-release-draft:
    name: Update next release draft
    runs-on: ubuntu-latest
    steps:
      - name: Update Release Drafter draft
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
